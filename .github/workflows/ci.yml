name: CI

# Lightweight gate for PRs: install, type-check, frontend build.
# Heavy Rust/Tauri builds run on tag push (see release.yml) to save minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: pnpm install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: app
        run: pnpm tsc --noEmit --pretty false

      - name: Static export build
        working-directory: app
        run: pnpm build:static
        env:
          NEXT_TELEMETRY_DISABLED: '1'
