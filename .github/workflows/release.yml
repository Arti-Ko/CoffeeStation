name: Release

# Build macOS .dmg and Windows .exe installer on tag push or manual dispatch.
# Produces a GitHub Release with both bundles attached.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the release (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: pnpm install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux deps (no-op here, placeholder for future ubuntu runner)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Build the static frontend in the runner's own shell. We deliberately
      # do NOT rely on Tauri's `beforeBuildCommand` here (it was removed from
      # tauri.conf.json) — on macos-14, pnpm spawned via that path hits a
      # corrupted bundled .cjs and SyntaxError-crashes before Next even starts.
      - name: Build static frontend
        working-directory: app
        run: pnpm build:static
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build & release via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for the updater. Without these the build still
          # succeeds but the updater plugin can't verify subsequent updates.
          # Add via: Settings → Secrets and variables → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'CoffeeStation ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for install and feature list.

            ## Downloads
            - **macOS (Apple Silicon)** — `CoffeeStation_*_aarch64.dmg`
            - **Windows (x64)** — `CoffeeStation_*_x64-setup.exe`

            Existing installs will see an in-app update prompt automatically.
            First-launch on macOS: right-click → Open (unsigned).
          releaseDraft: false
          prerelease: false
          # `updaterJsonPreferNsis: true` makes the latest.json point at the
          # NSIS installer instead of the MSI on Windows (smaller, no admin
          # prompt on update).
          updaterJsonPreferNsis: true
          args: ${{ matrix.platform == 'macos-14' && '--target aarch64-apple-darwin' || '' }}
